name: Web release checks
on: [push, pull_request]
jobs:
  verify:
    # Playwright 1.57 cannot install browser dependencies on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://mock.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: mock-public-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test:db
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
